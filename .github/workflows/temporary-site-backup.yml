name: Temporary site backup
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=hala-cake-backup.zip HEAD
      - name: Upload backup archive
        uses: actions/upload-artifact@v4
        with:
          name: hala-cake-site-backup
          path: hala-cake-backup.zip
          if-no-files-found: error
          retention-days: 7
